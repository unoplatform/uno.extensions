trigger:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - legacy/*

pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - legacy/*

variables:
  # iOS agent image, Xcode root and simulator target are kept together on purpose: the simulator
  # runtime the .app is linked against in the build job must exist on the agent that runs it, and
  # splitting these across files is how that pairing silently drifts.
  IosVmImage: 'macOS-15'
  # Xcode and the simulator runtime are a matched pair: actool refuses to compile the asset
  # catalog unless a simulator runtime matching the selected Xcode's iphonesimulator SDK is
  # installed. Build 227563 pinned Xcode 16.2 (iOS 18.2 SDK, build 22C146) on an agent whose only
  # installed runtimes were 18.5, 18.6 and 26.0-26.2, and failed with
  # "No simulator runtime version from [...] available to use with iphonesimulator SDK version".
  # Xcode 16.4 ships the iOS 18.5 SDK, which matches the installed 18.5 runtime (22F77).
  IosXCodeRoot: '/Applications/Xcode_16.4.app'
  IosSimulatorDevice: 'iPhone 16'
  IosSimulatorRuntimePrefix: 'com.apple.CoreSimulator.SimRuntime.iOS-18-5'

  # Which runtime tests the four device stages run. Scoped to the MSAL auth namespace, which is
  # Given_MsalAuthentication (15 cases) + Given_BrowserTokenCacheStorage (8), because the wider
  # non-hot-reload suite currently has 15 failing tests (verified against the pre-change
  # baseline, so they are rot rather than regressions). This MUST stay a namespace and not a
  # class name: the engine filter is a substring match on the fully-qualified test name, so
  # 'Given_MsalAuthentication' silently ran only half the auth suite. Widen to '!_HotReload'
  # once those failures are fixed - that is the whole point of turning these stages back on.
  RuntimeTestsFilter: 'Authentication.MSAL.UI.Tests'

stages:
- stage: Determine_Changes
  displayName: Determine Changes
  jobs:
  - template: stage-determine-changes.yml

- stage: Docs_Validations
  displayName: Docs Validations
  dependsOn: Determine_Changes
  # Trigger this stage when docs files are changed
  condition: and(succeeded(), or(eq(dependencies.Determine_Changes.outputs['evaluate_changes.DetermineChanges.docsOnly'], 'true'), eq(dependencies.Determine_Changes.outputs['evaluate_changes.DetermineChanges.mixedChanges'], 'true')))
  jobs:
  - template: stage-docs-validations.yml

- stage: Packages
  displayName: Packages
  dependsOn: Determine_Changes
  # Don't trigger this stage if only docs files are changed
  condition: and(succeeded(), ne(dependencies.Determine_Changes.outputs['evaluate_changes.DetermineChanges.docsOnly'], 'true'))
  jobs:
  - template: stage-build-packages.yml
  - template: stage-build-changelog.yml

- stage: Build_Samples
  displayName: Build Samples
  dependsOn: Determine_Changes
  # Don't trigger this stage if only docs files are changed
  condition: and(succeeded(), ne(dependencies.Determine_Changes.outputs['evaluate_changes.DetermineChanges.docsOnly'], 'true'))
  jobs:
  - template: stage-build-windows.yml
    parameters:
      solution: testing/TestHarness/TestHarness.sln
      solutionName: TestHarness_WinUI

  - template: stage-build-windows.yml
    parameters:
      solution: samples/Playground/Playground.sln
      solutionName: Playground

  # Disable: needs update https://github.com/unoplatform/uno.extensions/issues/3056
  #- template: stage-build-windows.yml
  #  parameters:
  #    solution: samples/MauiEmbedding/MauiEmbedding.sln
  #    solutionName: MauiEmbedding

  - template: stage-build-wasm.yml

- stage: Build_Tests
  displayName: Build Tests
  dependsOn: Determine_Changes
  # Don't trigger this stage if only docs files are changed
  condition: and(succeeded(), ne(dependencies.Determine_Changes.outputs['evaluate_changes.DetermineChanges.docsOnly'], 'true'))
  jobs:
  - template: stage-build-uitests-wasm.yml
  # Still disabled, but not for the original reason (unoplatform/uno#17668, long since merged).
  # Verified 2026-08-13: the full non-hot-reload runtime suite has 15 failing tests on this branch
  # AND at the pre-change baseline - navigation/ComboBox/logger cases that have rotted while the
  # stage was off. Enabling it as-is turns CI red on day one. The device stages below run the same
  # engine against a scoped filter instead; widening that filter is blocked on fixing those 15.
  # - template: stage-build-runtimetests-skia.yml
  - template: stage-build-runtimetests-skia-hotreload.yml
  # Builds the mobile / wasm runtime-test apps as artifacts; the jobs below consume them.
  - template: stage-build-runtimetests-mobile.yml

- stage: Runtime_Tests_Devices
  displayName: Runtime Tests - Devices
  dependsOn: Build_Tests
  jobs:
  - template: stage-runtime-tests-desktop.yml
  # Disabled: blocked on Uno.UI.RuntimeTests.Engine, not on this repo. Its embedded runner guards
  # the `Console.CancelKeyPress` registration with `#if !__WASM__`, but Uno.Sdk stopped defining
  # `__WASM__` for consumer projects (Skia-WASM heads consume the plain netX.0 Uno.UI), so the
  # registration is compiled in and throws PlatformNotSupportedException before any test runs -
  # verified in build 228808. Defining `__WASM__` here does not work either: the engine's other
  # `#if __WASM__` branches call `Uno.Foundation.WebAssemblyRuntime.InvokeJS`, which a Skia-WASM
  # head does not reference (CS0234). Re-enable once the engine switches to a runtime check.
  # - template: stage-runtime-tests-wasm.yml
  # Disabled: the Android head does not package its ProjectReference closure, so the APK starts
  # and then aborts in monodroid with "failed to load bundled assembly Uno.Extensions.Reactive.dll".
  # Reproduced locally, independent of CI: for the same head and configuration,
  # bin/.../net9.0-desktop contains 145 assemblies including the full project closure, while
  # bin/.../net9.0-android contains exactly one (its own). Not caused by `-o`, by
  # EmbedAssembliesIntoApk (which did fix a separate Fast Deployment abort - keep it), or by the
  # emulator. This is a build-layout problem in the Android TFM, almost certainly the interaction
  # between src/Directory.Build.props' BaseOutputPath=bin\$(MSBuildProjectName) redirection and
  # the Android SDK's assembly collection; the desktop and iOS lanes are unaffected. The Android
  # head is still *built* by `Build Runtime Tests - Android`, which is new coverage - it did not
  # compile at all before this branch. Re-enable this line once the closure lands in the APK.
  # - template: stage-runtime-tests-android.yml
  - template: stage-runtime-tests-ios.yml

##
## Publishing
##

- stage: Publish_Dev
  displayName: 'Publish - Dev NuGet'
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature')), not(eq(variables['build.reason'], 'PullRequest')))
  dependsOn: Packages
  jobs:
  - template: publish/publish-nuget-dev.yml
    parameters:
      vmImage: 'windows-2022'

- stage: Publish_Prod_Dev
  displayName: 'Publish - Prod Uno Dev Feed'
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), not(eq(variables['build.reason'], 'PullRequest')))
  dependsOn: Packages
  jobs:
  - template: publish/publish-nuget-prod-dev.yml
    parameters:
      vmImage: 'windows-2022'
  
- stage: Publish_Prod_Public
  displayName: 'Publish - Prod NuGet.org'
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), not(eq(variables['build.reason'], 'PullRequest')))
  dependsOn: Publish_Prod_Dev
  jobs:
  - template: publish/publish-nuget-prod.yml
    parameters:
      vmImage: 'windows-2022'
