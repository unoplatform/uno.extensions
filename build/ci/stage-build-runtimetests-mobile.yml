# Builds the runtime-tests app for the mobile / wasm heads and publishes each as a pipeline
# artifact. Split from the stages that *run* them so a Linux agent can build the Android APK while
# the emulator job (and the macOS-hosted iOS job) consume the artifacts afterwards - the same
# split Studio Live uses.
jobs:
  - job: Build_RuntimeTests_Android
    displayName: 'Build Runtime Tests - Android'
    timeoutInMinutes: 60
    pool:
      vmImage: 'ubuntu-24.04'

    steps:
      - checkout: self
        clean: true

      # dotnet-install.yml only lays down the SDK - the whole project graph fails with NETSDK1147
      # without the android workload, including the *.UI.Tests projects pulled in as
      # ProjectReferences. InstallAndroidSdk provisions the platform jars the APK build needs.
      - template: templates/dotnet-install-linux.yml
        parameters:
          InstallAndroidSdk: true

      - template: templates/canary-updater.yml

      - script: |
          dotnet publish src/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests.csproj \
            -c Debug -f net9.0-android \
            -p:Build_Windows=false -p:Build_iOS=false -p:Build_MacCatalyst=false -p:Build_Web=false \
            -o $(build.artifactstagingdirectory)/android-runtime-tests \
            -bl:$(build.artifactstagingdirectory)/binlogs/build-android-runtime-tests.binlog
        displayName: 'Publish Android runtime tests APK'

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: $(build.artifactstagingdirectory)/android-runtime-tests
          artifactName: android-runtime-tests

      - task: PublishBuildArtifacts@1
        condition: failed()
        inputs:
          PathtoPublish: $(build.artifactstagingdirectory)/binlogs
          ArtifactName: android-runtime-tests-binlogs

  - job: Build_RuntimeTests_Wasm
    displayName: 'Build Runtime Tests - WebAssembly'
    timeoutInMinutes: 60
    pool:
      vmImage: 'ubuntu-24.04'

    steps:
      - checkout: self
        clean: true

      # uno-check --fix installs the wasm-tools workload; without it the build fails UNOWA0001.
      - template: templates/dotnet-install-linux.yml
      - template: templates/canary-updater.yml

      - script: |
          dotnet publish src/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests.csproj \
            -c Debug -f net9.0-browserwasm \
            -p:Build_Windows=false -p:Build_iOS=false -p:Build_MacCatalyst=false -p:Build_Android=false \
            -o $(build.artifactstagingdirectory)/wasm-runtime-tests \
            -bl:$(build.artifactstagingdirectory)/binlogs/build-wasm-runtime-tests.binlog
        displayName: 'Publish WebAssembly runtime tests'

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: $(build.artifactstagingdirectory)/wasm-runtime-tests
          artifactName: wasm-runtime-tests

      - task: PublishBuildArtifacts@1
        condition: failed()
        inputs:
          PathtoPublish: $(build.artifactstagingdirectory)/binlogs
          ArtifactName: wasm-runtime-tests-binlogs

  - job: Build_RuntimeTests_iOS
    displayName: 'Build Runtime Tests - iOS'
    timeoutInMinutes: 60
    pool:
      vmImage: $(IosVmImage)

    variables:
      # The simulator runtime this .app is linked against must also exist on the agent that runs
      # it. Both the image and the Xcode root are pipeline-level variables so the build job and the
      # test job can never drift apart - that pairing is the failure mode Studio Live hit most.
      xCodeRoot: $(IosXCodeRoot)

    steps:
      - checkout: self
        clean: true

      - template: templates/dotnet-install-mac.yml
      - template: templates/canary-updater.yml

      # NOT templates/ios-build-select-version.yml: that template is Xamarin-era and `ls`es
      # /Library/Frameworks/Xamarin.*.framework, which no longer exist on the hosted macOS images -
      # it exits 1 before doing anything. Nothing in this repo built iOS in CI, so it went stale
      # unnoticed. Select Xcode directly instead.
      - bash: |
          set -uo pipefail
          echo "Xcode versions available on this agent:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          if [ -d "$(xCodeRoot)" ]; then
            sudo xcode-select --switch "$(xCodeRoot)"
          else
            echo "WARNING: $(xCodeRoot) not found - continuing with the agent default so the log"
            echo "above shows what to pin IosXCodeRoot to."
          fi
          xcodebuild -version
          echo "Installed simulator runtimes:"
          xcrun simctl list runtimes || true
        displayName: 'Select Xcode'

      - script: dotnet workload install ios
        displayName: 'Install ios workload'

      - script: |
          dotnet publish src/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests.csproj \
            -c Debug -f net9.0-ios \
            -p:RuntimeIdentifier=iossimulator-x64 \
            -p:Build_Windows=false -p:Build_Android=false -p:Build_MacCatalyst=false -p:Build_Web=false \
            -o $(build.artifactstagingdirectory)/ios-runtime-tests \
            -bl:$(build.artifactstagingdirectory)/binlogs/build-ios-runtime-tests.binlog
        displayName: 'Publish iOS simulator runtime tests'

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: $(build.artifactstagingdirectory)/ios-runtime-tests
          artifactName: ios-runtime-tests

      - task: PublishBuildArtifacts@1
        condition: failed()
        inputs:
          PathtoPublish: $(build.artifactstagingdirectory)/binlogs
          ArtifactName: ios-runtime-tests-binlogs
