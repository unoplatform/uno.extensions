# Runs hot-reload runtime tests on an Android emulator and an iOS simulator.
#
# Unlike the other device stages, each job builds the app itself: the DevServer that compiles the
# deltas loads the same source tree, and the app bakes absolute paths into its assembly
# (RuntimeTestsSourceProjectAttribute, ProjectConfigurationAttribute) that only hold on the agent
# that built it.
#
# The engine can't spawn a secondary app on mobile, so the scripts run the [RunsInSecondaryApp]
# classes in-process (UITEST_RUNTIME_IS_SECONDARY_APP) against a DevServer they start themselves.
parameters:
  # Fixed: the port is baked into the app at build time, and the agents are fresh. Below the
  # ephemeral range (49152+), which Windows also carves reserved blocks out of.
  DevServerPort: 47100
  # One app launch per entry (';'-separated). ~100 deltas piled into one Mono process end in
  # BadImageFormatException (unoplatform/uno.extensions#3243), so Given_Navigation_HotReload gets
  # its own launch; desktop runs one secondary app per class for the same reason. Every launch
  # makes the DevServer reload its workspace (~5 min on the mac agent), so keep the list short.
  # Engine filters are substring matches on the full test name. Only chain '& !' exclusions: the
  # parser has no operator precedence, so mixing '|' with '&' misparses even with parentheses.
  # 'Given_HotReload.' (with the dot) is exactly the Reactive and Navigation Given_HotReload classes.
  # Each exclusion names the issue that tracks it. Given_TabBar_HotReload is left out on both
  # platforms (Android: #3237; iOS: not yet measured).
  # Per app launch, so a hung launch can't eat the whole job: up to 10 min of DevServer workspace
  # load (first launch only), then 2-5 min of tests.
  RunTimeoutSeconds: 1200
  # #3241: When_PageXamlUpdatedWhileUnmaterialized (API 34). #3250: When_VmCtorParamOrderChangedViaHR
  # (Mono SIGSEGV applying the delta, intermittent).
  AndroidTestFilters: >-
    Given_HotReload.
    & !When_PageXamlUpdatedWhileUnmaterialized_Then_RevealShowsUpdatedContent;
    Given_Navigation_HotReload
    & !When_VmCtorParamOrderChangedViaHR_Then_NewInstanceReflectsUpdate
  # #3240: the five MVUX model-update tests. #3242: When_RemoveAndReAddMultipleProperties.
  # #3245: Region.Name changed via XAML HR (three tests, intermittent).
  IosTestFilters: >-
    Given_HotReload.
    & !When_UpdateMvuxFeedSource_Then_NewViewModelReflectsUpdate
    & !When_NewVMWithCtorDepsConstructedAfterHR_Then_ReflectsUpdate
    & !When_UpdateInheritedParentModel_Then_ChildBindingsRefresh
    & !When_AddDerivedFeedToModelWithStateAndCommand_Then_CommandUpdatesBoundState
    & !When_UpdateStateValue_Then_NewViewModelReflectsUpdate
    & !When_RemoveAndReAddMultipleProperties_Then_AllBindingsWork;
    Given_Navigation_HotReload
    & !When_RegionNameAddedViaXamlHR_Then_NavigationResolvesNewRegion
    & !When_RegionRenamedViaXamlHR_Then_NavigationUsesNewName
    & !When_PanelRegionNamesSwappedViaXamlHR_Then_NavigationStillWorks

jobs:
  - job: Android_HotReload_Tests
    displayName: 'Hot-Reload Tests - Android Emulator (Debug)'
    # The plain Android lane needs 120 minutes for SDK provisioning and the tests alone; this job
    # also builds the app and waits for the DevServer to load its workspace.
    timeoutInMinutes: 180
    cancelTimeoutInMinutes: 0

    pool:
      vmImage: 'ubuntu-24.04'

    variables:
      # Read by host-cleanup-linux.sh: the build needs the agent's Android SDK (XA5300 otherwise).
      KEEP_ANDROID_SDK: 1
      RuntimeTestsProject: src/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests.csproj

    steps:
      - checkout: self
        clean: true

      - template: templates/host-cleanup-linux.yml

      - template: templates/dotnet-install-uno-check.yml
        parameters:
          InstallAndroidSdk: true

      - template: templates/canary-updater.yml

      # A props file rather than /p: switches: the DevServer's own MSBuildWorkspace never sees
      # command-line properties, and anything that changes the compilation (the generated endpoint
      # attribute, the Hot Design define) has to match the app it patches, or every delta is a rude
      # edit.
      - bash: |
          set -euo pipefail
          cat > DebugPlatforms.props << 'EOF'
          <Project>
            <!-- Generated by the CI stage - do not commit. -->
            <PropertyGroup>
              <Build_Android>true</Build_Android>
              <Build_iOS>false</Build_iOS>
              <Build_MacCatalyst>false</Build_MacCatalyst>
              <Build_Windows>false</Build_Windows>
              <Build_Web>false</Build_Web>
              <Build_Desktop>false</Build_Desktop>
              <UnoDisableHotDesign>true</UnoDisableHotDesign>
              <UnoDisableMCPSupport>true</UnoDisableMCPSupport>
              <UnoRemoteControlHost>127.0.0.1</UnoRemoteControlHost>
              <UnoRemoteControlPort>${{ parameters.DevServerPort }}</UnoRemoteControlPort>
            </PropertyGroup>
          </Project>
          EOF
          cat DebugPlatforms.props
        displayName: 'Restrict platforms to Android'
        workingDirectory: $(Build.SourcesDirectory)

      # `build`, not `publish` as in stage-build-runtimetests-mobile.yml: the DevServer patches the
      # outputs of a regular Debug build. EmbedAssembliesIntoApk for the same reason as there - the
      # APK is installed with a plain `adb install`.
      - script: |
          dotnet build $(RuntimeTestsProject) \
            -c Debug -f net10.0-android \
            -p:EmbedAssembliesIntoApk=true \
            -bl:$(Build.ArtifactStagingDirectory)/binlogs/build-android-hotreload-tests.binlog
        displayName: 'Build Android runtime tests (Debug)'
        workingDirectory: $(Build.SourcesDirectory)

      # See stage-runtime-tests-android.yml.
      - bash: |
          if [ -e /dev/kvm ]; then
            sudo chown "${USER}" /dev/kvm || true
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm
          else
            echo "ERROR: /dev/kvm is not exposed on this agent." >&2
            exit 1
          fi
        displayName: 'Ensure KVM access'

      - bash: |
          set -euo pipefail
          export DEV_SERVER_HOST_DLL="$(dotnet msbuild $(RuntimeTestsProject) -nologo -t:GetRemoteControlHostPath -p:TargetFramework=net10.0-android \
            | sed -n 's:.*<RemoteControlHostPath>\(.*\)</RemoteControlHostPath>.*:\1:p' | head -n 1)"
          echo "DevServer: ${DEV_SERVER_HOST_DLL}"
          chmod +x build/test-scripts/android-emulator-runtime-tests.sh
          build/test-scripts/android-emulator-runtime-tests.sh
        displayName: 'Run Android emulator hot-reload tests'
        workingDirectory: $(Build.SourcesDirectory)
        env:
          BUILD_SOURCESDIRECTORY: $(Build.SourcesDirectory)
          RuntimeTestsArtifactPath: $(Build.SourcesDirectory)/src/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests/bin
          TEST_FILTERS: ${{ parameters.AndroidTestFilters }}
          RUN_TIMEOUT_SECONDS: ${{ parameters.RunTimeoutSeconds }}
          DEV_SERVER_PORT: ${{ parameters.DevServerPort }}

      - task: PublishTestResults@2
        condition: always()
        inputs:
          testRunTitle: 'Android Emulator Hot-Reload Tests'
          testResultsFormat: 'NUnit'
          testResultsFiles: '$(Build.SourcesDirectory)/build/android-runtime-tests/android-runtime-tests-results.xml'
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true

      # Includes devserver.log, the only record of why a delta was not produced.
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/build/android-runtime-tests'
          artifact: 'android-hotreload-tests-logs-$(System.JobAttempt)'
          publishLocation: 'pipeline'

      - task: PublishBuildArtifacts@1
        condition: failed()
        inputs:
          PathtoPublish: $(Build.ArtifactStagingDirectory)/binlogs
          ArtifactName: android-hotreload-tests-binlogs

  - job: iOS_HotReload_Tests
    displayName: 'Hot-Reload Tests - iOS Simulator (Debug)'
    # ~30 min to build, then up to RunTimeoutSeconds per test launch.
    timeoutInMinutes: 120
    cancelTimeoutInMinutes: 0

    pool:
      vmImage: $(IosVmImage)

    variables:
      xCodeRoot: $(IosXCodeRoot)
      RuntimeTestsProject: src/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests.csproj

    steps:
      - checkout: self
        clean: true

      - template: templates/dotnet-install-uno-check.yml
      - template: templates/canary-updater.yml

      # See stage-build-runtimetests-mobile.yml for why Xcode is selected directly.
      - bash: |
          set -uo pipefail
          if [ -d "$(xCodeRoot)" ]; then
            sudo xcode-select --switch "$(xCodeRoot)"
          else
            echo "WARNING: $(xCodeRoot) not found - continuing with the agent default."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
          fi
          xcodebuild -version
        displayName: 'Select Xcode'

      # See the Android job for why this is a props file.
      - bash: |
          set -euo pipefail
          cat > DebugPlatforms.props << 'EOF'
          <Project>
            <!-- Generated by the CI stage - do not commit. -->
            <PropertyGroup>
              <Build_Android>false</Build_Android>
              <Build_iOS>true</Build_iOS>
              <Build_MacCatalyst>false</Build_MacCatalyst>
              <Build_Windows>false</Build_Windows>
              <Build_Web>false</Build_Web>
              <Build_Desktop>false</Build_Desktop>
              <UnoDisableHotDesign>true</UnoDisableHotDesign>
              <UnoDisableMCPSupport>true</UnoDisableMCPSupport>
              <UnoRemoteControlHost>127.0.0.1</UnoRemoteControlHost>
              <UnoRemoteControlPort>${{ parameters.DevServerPort }}</UnoRemoteControlPort>
            </PropertyGroup>
          </Project>
          EOF
          cat DebugPlatforms.props
        displayName: 'Restrict platforms to iOS'
        workingDirectory: $(Build.SourcesDirectory)

      # Same flags and reasons as the iOS job in stage-build-runtimetests-mobile.yml.
      - script: |
          dotnet build $(RuntimeTestsProject) \
            -c Debug -f net10.0-ios \
            -p:CodesignRequireProvisioningProfile=false \
            -bl:$(Build.ArtifactStagingDirectory)/binlogs/build-ios-hotreload-tests.binlog
        displayName: 'Build iOS simulator runtime tests (Debug)'
        workingDirectory: $(Build.SourcesDirectory)

      - bash: |
          set -euo pipefail
          export DEV_SERVER_HOST_DLL="$(dotnet msbuild $(RuntimeTestsProject) -nologo -t:GetRemoteControlHostPath -p:TargetFramework=net10.0-ios \
            | sed -n 's:.*<RemoteControlHostPath>\(.*\)</RemoteControlHostPath>.*:\1:p' | head -n 1)"
          echo "DevServer: ${DEV_SERVER_HOST_DLL}"
          chmod +x build/test-scripts/ios-simulator-runtime-tests.sh
          build/test-scripts/ios-simulator-runtime-tests.sh
        displayName: 'Run iOS simulator hot-reload tests'
        workingDirectory: $(Build.SourcesDirectory)
        env:
          BUILD_SOURCESDIRECTORY: $(Build.SourcesDirectory)
          RuntimeTestsArtifactPath: $(Build.SourcesDirectory)/src/Uno.Extensions.RuntimeTests/Uno.Extensions.RuntimeTests/bin
          SIMULATOR_DEVICE: $(IosSimulatorDevice)
          SIMULATOR_RUNTIME_PREFIX: $(IosSimulatorRuntimePrefix)
          TEST_FILTERS: ${{ parameters.IosTestFilters }}
          RUN_TIMEOUT_SECONDS: ${{ parameters.RunTimeoutSeconds }}
          DEV_SERVER_PORT: ${{ parameters.DevServerPort }}

      - task: PublishTestResults@2
        condition: always()
        inputs:
          testRunTitle: 'iOS Simulator Hot-Reload Tests'
          testResultsFormat: 'NUnit'
          testResultsFiles: '$(Build.SourcesDirectory)/build/ios-runtime-tests/ios-runtime-tests-results.xml'
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true

      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/build/ios-runtime-tests'
          artifact: 'ios-hotreload-tests-logs-$(System.JobAttempt)'
          publishLocation: 'pipeline'

      - task: PublishBuildArtifacts@1
        condition: failed()
        inputs:
          PathtoPublish: $(Build.ArtifactStagingDirectory)/binlogs
          ArtifactName: ios-hotreload-tests-binlogs
