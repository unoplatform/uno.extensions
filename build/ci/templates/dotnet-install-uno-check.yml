parameters:
  # Same values as dotnet-install-windows.yml / dotnet-install-mac.yml - the lanes must install the
  # same SDK and run the same uno-check, or a stage builds against a different toolchain than the
  # one it is compared against.
  # The .NET 10 SDK: these lanes compile an Apple TFM (Uno.Toolkit's iOS assembly is built against
  # Microsoft.iOS 26, which only the .NET 10 iOS workload supplies) or need a net10.0 tool, and
  # uno-check installs the matching workloads for whichever SDK is in use. Lanes that run inside
  # unoplatform/wasm-build must NOT use this - see the note in dotnet-install.yml.
  DotNetVersion: '10.0.x'
  UnoCheck_Version: '1.34.1'
  UnoCheckParameters: ''
  # Opt-in: let uno-check install / validate the Android SDK. Defaults to skipped so the desktop
  # and WebAssembly lanes don't pay the cost. Android build stages set this to true so sdkmanager
  # provisions platform-tools + platforms + build-tools on the runner.
  InstallAndroidSdk: false

steps:
  - template: dotnet-install.yml
    parameters:
      DotNetVersion: '${{ parameters.DotNetVersion }}'
      UnoCheck_Version: '${{ parameters.UnoCheck_Version }}'
      UnoCheckParameters: '${{ parameters.UnoCheckParameters }}'

  - template: jdk-setup.yml

  # pwsh rather than powershell: this template runs on Linux and macOS agents too, where the
  # `powershell` shortcut (Windows PowerShell) is not available.
  - ${{ if eq(parameters.InstallAndroidSdk, true) }}:
    - pwsh: |
        & dotnet tool update --global uno.check --version ${{ parameters.UnoCheck_Version }} --add-source https://api.nuget.org/v3/index.json
        & uno-check -v --ci --non-interactive --fix --skip xcode --skip gtk3 --skip vswin --skip vsmac --skip androidemulator ${{ parameters.UnoCheckParameters }}
      displayName: 'Install .NET Workloads (with Android SDK)'
      errorActionPreference: continue
      ignoreLASTEXITCODE: true
      retryCountOnTaskFailure: 3

  - ${{ if ne(parameters.InstallAndroidSdk, true) }}:
    - pwsh: |
        & dotnet tool update --global uno.check --version ${{ parameters.UnoCheck_Version }} --add-source https://api.nuget.org/v3/index.json
        & uno-check -v --ci --non-interactive --fix --skip xcode --skip gtk3 --skip vswin --skip vsmac --skip androidsdk --skip androidemulator ${{ parameters.UnoCheckParameters }}
      displayName: 'Install .NET Workloads'
      errorActionPreference: continue
      ignoreLASTEXITCODE: true
      retryCountOnTaskFailure: 3
