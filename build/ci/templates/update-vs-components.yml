parameters:
  sdkVersion: '19041'

steps:

  # https://github.com/actions/runner-images/issues/6082#issuecomment-1215100175
  - powershell: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @(
            "Component.Xamarin"
          )
          [string]$workloadArgs = $componentsToAdd | ForEach-Object {" --add " +  $_}
          $Arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"",$workloadArgs, '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -eq 0)
          {
              Write-Host "components have been successfully added"
          }
          else
          {
              Write-Host "components were not installed"
              exit 1
          }
    displayName: 'Add VS components (Component.Xamarin)'
    # The VS Installer occasionally hangs with no output; without a bound it burns the whole
    # 90-minute job budget (#3139 build 229724, #3151 build 229783 - the sibling job ran the same
    # step in under five minutes each time). vs_installer modify is idempotent, so a retry is safe.
    timeoutInMinutes: 15
    retryCountOnTaskFailure: 2
