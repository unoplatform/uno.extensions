parameters:
  # Kept in step with dotnet-install-windows.yml / dotnet-install-mac.yml - the three should always
  # install the same SDK and run the same uno-check version, or a lane starts building against a
  # different toolchain than the one it is compared against.
  DotNetVersion: '9.0.200'
  UnoCheck_Version: '1.30.1'
  Dotnet_Tools: '~/.dotnet/tools'
  UnoCheckParameters: ''
  # Opt-in: let uno-check provision the Android SDK (platform-tools, platforms, build-tools).
  # Skipped by default so the desktop and WebAssembly lanes don't pay for it; the Android build
  # stage sets this to true. The emulator test stage does NOT need it - that script provisions its
  # own SDK under build/android-sdk so it controls the AVD image.
  InstallAndroidSdk: false

steps:
  - task: UseDotNet@2
    displayName: 'Use .NET Core SDK ${{ parameters.DotNetVersion }}'
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: ${{ parameters.DotNetVersion }}
      includePreviewVersions: false

  - template: jdk-setup.yml

  # uno-check --fix is what installs the workloads (android, wasm-tools, ...). Running individual
  # `dotnet workload install` commands per stage drifts from what Windows and macOS lanes get.
  # gtk3/xcode/vswin/vsmac are irrelevant on a Linux agent; androidemulator is skipped because the
  # emulator stage creates its own AVD.
  - ${{ if eq(parameters.InstallAndroidSdk, true) }}:
    - bash: |
        dotnet tool update --global uno.check --version ${{ parameters.UnoCheck_Version }} --add-source https://api.nuget.org/v3/index.json
        uno-check --verbose --ci --non-interactive --fix --skip xcode --skip gtk3 --skip vswin --skip vsmac --skip androidemulator ${{ parameters.UnoCheckParameters }}
      displayName: 'Install .NET Workloads (with Android SDK)'
      retryCountOnTaskFailure: 3

  - ${{ if ne(parameters.InstallAndroidSdk, true) }}:
    - bash: |
        dotnet tool update --global uno.check --version ${{ parameters.UnoCheck_Version }} --add-source https://api.nuget.org/v3/index.json
        uno-check --verbose --ci --non-interactive --fix --skip xcode --skip gtk3 --skip vswin --skip vsmac --skip androidsdk --skip androidemulator ${{ parameters.UnoCheckParameters }}
      displayName: 'Install .NET Workloads'
      retryCountOnTaskFailure: 3
