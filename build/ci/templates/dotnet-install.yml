parameters:
  DotNetVersion: '10.0.x'
  UnoCheck_Version: ''
  UnoCheckParameters: ''

steps:
  # Required for caching.
  # `DOTNET_INSTALL_DIR` tells `UseDotNet@2` where to drop the SDK.
  # `DOTNET_ROOT` tells the `dotnet` host (including subprocesses spawned by uno-check,
  # `dotnet workload list`, etc.) to use that install - without it, `dotnet` falls back to the
  # agent image's system .NET (macOS images ship `maccatalyst` + `maui` pre-installed) and our
  # workload installs leak into it.
  - pwsh: |
      echo "##vso[task.setvariable variable=DOTNET_INSTALL_DIR;]$(Build.SourcesDirectory)/.dotnet"
      echo "##vso[task.setvariable variable=DOTNET_ROOT;]$(Build.SourcesDirectory)/.dotnet"
    displayName: 'Set DOTNET_INSTALL_DIR for macOS/Linux'
    condition: or(eq(variables['Agent.OS'], 'Linux'), eq(variables['Agent.OS'], 'Darwin'))

  - pwsh: |
      echo "##vso[task.setvariable variable=DOTNET_INSTALL_DIR;]$(Build.SourcesDirectory)\.dotnet"
      echo "##vso[task.setvariable variable=DOTNET_ROOT;]$(Build.SourcesDirectory)\.dotnet"
    displayName: 'Set DOTNET_INSTALL_DIR for Windows'
    condition: eq(variables['Agent.OS'], 'Windows_NT')

  # `DotNetVersion` MUST be in the key - without it, an old cache is restored unchanged when the
  # version is bumped, leaving the prior SDK plus any workloads it accumulated in `.dotnet/sdk/`.
  # `UseDotNet@2` then layers the new SDK on top without removing the old one, so later builds keep
  # paying for workloads no lane actually needs.
  - task: Cache@2
    inputs:
      key: dotnet | "$(Agent.OS)" | "$(Agent.JobName)" | "${{ parameters.DotNetVersion }}" | "${{ parameters.UnoCheck_Version }}" | "${{ parameters.UnoCheckParameters }}"
      path: $(DOTNET_INSTALL_DIR)
    displayName: Set Cache for dotnet install

  - pwsh: |
      if ($IsMacOS -or $IsLinux)
      {
        $emsdkPath="$(Build.SourcesDirectory)/.emscripten-cache"
      }
      else
      {
        # The cache must be in the user folder if the emsdk tooling is on a separate drive
        # from the workspace.
        $emsdkPath="$env:USERPROFILE\.emscripten-cache"
      }

      echo "##vso[task.setvariable variable=WasmCachePath;]$emsdkPath"

      # New-Item, not `mkdir -Force`: on Linux PowerShell has no mkdir function, so `mkdir`
      # resolves to /usr/bin/mkdir, which rejects -Force ("invalid option -- 'F'") and fails the
      # step on every Linux and macOS agent. -Force keeps this idempotent for a re-run or a
      # self-hosted agent where the directory already exists.
      New-Item -ItemType Directory -Force -Path $emsdkPath | Out-Null
    displayName: Set EMSDK Path

  - task: Cache@2
    inputs:
      key: emsdk | "$(Agent.OS)" | "$(Agent.JobName)" | "$(System.StageName)" | "${{ parameters.UnoCheck_Version }}"
      path: $(WasmCachePath)
    displayName: Set Cache for EMSDK

  - task: UseDotNet@2
    displayName: 'Use .NET SDK ${{ parameters.DotNetVersion }}'
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: ${{ parameters.DotNetVersion }}
      installationPath: $(DOTNET_INSTALL_DIR)

  # The .NET 10 SDK builds the net9.0 targets but does not carry the 9.0 runtime, and the desktop
  # and hot-reload lanes *run* net9.0 heads (`dotnet Uno.Extensions.RuntimeTests.dll`) from this
  # install. Without it those lanes fail at launch with "You must install .NET 9.0".
  - task: UseDotNet@2
    displayName: 'Use .NET 9 runtime (net9.0 test heads)'
    retryCountOnTaskFailure: 3
    inputs:
      packageType: runtime
      version: 9.0.x
      installationPath: $(DOTNET_INSTALL_DIR)
