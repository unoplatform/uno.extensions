jobs:
  - job: RuntimeTestsWasm
    displayName: 'Runtime Tests - WebAssembly'
    timeoutInMinutes: 45
    cancelTimeoutInMinutes: 0

    pool:
      vmImage: 'ubuntu-24.04'

    variables:
      RuntimeTestsArtifactPath: $(Build.SourcesDirectory)/build/wasm-runtime-tests-app

    steps:
      - checkout: self
        clean: true

      - template: templates/host-cleanup-linux.yml
      # This job only runs the Playwright-based runner tool against a published artifact, so it
      # needs the SDK but no workloads; the shared template keeps the SDK version aligned anyway.
      - template: templates/dotnet-install-uno-check.yml

      # Uno.UI.RuntimeTests.Engine.Wasm.Runner ships as tools/net10.0/any at every published
      # version, and `dotnet tool install` picks the tool asset from the *SDK* version - not from
      # the installed runtimes. A .NET 9 SDK finds no usable tools/<tfm> folder and reports the
      # misleading "Settings file 'DotnetToolSettings.xml' was not found in the package" (the file
      # is present). Installing the .NET 10 runtime alone is therefore not enough; the SDK is what
      # matters. Safe here because this job only runs the tool - it builds nothing - and
      # global.json pins no SDK version.
      - task: UseDotNet@2
        displayName: 'Install .NET 10 SDK (for the WebAssembly runner tool)'
        retryCountOnTaskFailure: 3
        inputs:
          packageType: sdk
          version: '10.x'
          installationPath: $(DOTNET_INSTALL_DIR)

      - task: NodeTool@0
        inputs:
          versionSpec: '18.x'

      - task: DownloadPipelineArtifact@2
        displayName: 'Download WebAssembly runtime tests artifact'
        inputs:
          artifact: wasm-runtime-tests
          path: $(RuntimeTestsArtifactPath)

      - bash: |
          chmod +x build/test-scripts/wasm-runtime-tests.sh
          build/test-scripts/wasm-runtime-tests.sh
        displayName: 'Run WebAssembly runtime tests'
        env:
          BUILD_SOURCESDIRECTORY: $(Build.SourcesDirectory)
          RuntimeTestsArtifactPath: $(RuntimeTestsArtifactPath)
          # See the iOS stage: the script's own '!_HotReload' default runs the whole suite, which
          # never reports results inside the browser timeout.
          TEST_FILTER: $(RuntimeTestsFilter)

      - task: PublishTestResults@2
        condition: always()
        inputs:
          testRunTitle: 'WebAssembly Runtime Tests'
          testResultsFormat: 'NUnit'
          testResultsFiles: '$(Build.SourcesDirectory)/build/wasm-runtime-tests/wasm-runtime-tests-results.xml'
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true

      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/build/wasm-runtime-tests/logs'
          artifact: 'wasm-runtime-tests-logs-$(System.StageAttempt)'
          publishLocation: 'pipeline'
