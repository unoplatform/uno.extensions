jobs:
- job: Wasm_UITests
  cancelTimeoutInMinutes: 0
  displayName: 'UI Tests - WebAssembly'
  container: unoplatform/wasm-build:3.0

  pool:
    vmImage: 'ubuntu-24.04'

  variables:
    NUGET_PACKAGES: $(build.sourcesdirectory)/.nuget

  steps:
  - checkout: self
    clean: true

  - template: templates/host-cleanup-linux.yml

  - template: templates/dotnet-install.yml

  # Uno.Wasm.Bootstrap relinks the SkiaSharp native WebAssembly assets, which needs the wasm-tools
  # workload in the SDK this job installs (not the container's). Without it the build fails with
  # "UNOWA0001: Native WebAssembly assets were detected, but the wasm-tools workload could not be
  # located". Until now the job depended on a warm `Set Cache for dotnet install` entry happening to
  # carry the workload - so any change to the cache key (the SDK version is part of it) broke it.
  # Same step, same reason, as stage-build-wasm.yml.
  - script: dotnet workload install wasm-tools
    displayName: 'Install wasm-tools workload'
    retryCountOnTaskFailure: 3

  - template: templates/canary-updater.yml
  
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'

  - bash: |
      chmod +x build/ci/scripts/wasm-uitest-run.sh
      build/ci/scripts/wasm-uitest-run.sh
    env:
      BUILD_SOURCESDIRECTORY: "$(build.sourcesdirectory)"
      BUILD_ARTIFACTSTAGINGDIRECTORY: "$(build.artifactstagingdirectory)"
    displayName: 'Running build'

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testRunTitle: 'WebAssembly Test Run'
      testResultsFormat: 'NUnit'
      testResultsFiles: '$(build.sourcesdirectory)/build/TestResult.xml'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)
      ArtifactName: uno-uitest-tests
      ArtifactType: Container
